name: tui

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test src/lib

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun test src/lib
      - run: bun run package:windows
      - run: bun run check:portable
      - uses: actions/upload-artifact@v4
        with:
          name: gvs-tui-windows-x64
          path: .build/releases/gvs-tui-*-windows-x64.zip*
          if-no-files-found: error
          retention-days: 14
