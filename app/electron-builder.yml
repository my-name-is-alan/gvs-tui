appId: shop.videohack.gvs
productName: GVS
copyright: GVS
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
npmRebuild: false
# 只用来生成 latest.yml（electron-updater 的更新清单）；实际检查地址在 updater.ts 里按 desktop-v* 发布算出来
publish:
  provider: generic
  url: https://github.com/my-name-is-alan/gvs-tui/releases/download/desktop-v${version}
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Windows 包自带媒体工具（与 TUI 仓库 bin/ 同一套）
  extraResources:
    - from: ../bin
      to: bin
      filter:
        - "*.exe"
        - "tencent-mobile42-decode.exe.sha256"
        - "!packager.exe"
        - "!gvs-tui-bridge.exe"
        - licenses/**
        - manifest.json
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-x64.${ext}
  shortcutName: GVS
mac:
  extraResources:
    - from: ../.build/iqcn-local/darwin-${arch}/iqcn-local
      to: bin/iqcn-local
    - from: ../.build/mobile42/darwin-${arch}/tencent-mobile42-decode
      to: bin/tencent-mobile42-decode
    - from: ../.build/mobile42/darwin-${arch}/tencent-mobile42-decode.sha256
      to: bin/tencent-mobile42-decode.sha256
    - from: ../.build/managed-re/osx-${arch}/N_m3u8DL-RE
      to: bin/N_m3u8DL-RE
    - from: ../bin/licenses
      to: bin/licenses
  target:
    - target: dmg
      arch: [arm64, x64]
  # macOS 需要在 1024 画布中使用约 824px 的圆角底板；满画布的旧式 PNG
  # 会在 macOS 26 Tahoe 中被缩进系统灰色底板，显示成“图标没撑满”。
  icon: build/icon-mac.icns
  category: public.app-category.video
  # 没有 Apple 证书：不签名（首次打开需右键 → 打开；也无法自动更新，只提示新版本）
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
